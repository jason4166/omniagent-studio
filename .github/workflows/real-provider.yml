name: Optional real Provider smoke
on:
  workflow_dispatch:
    inputs:
      model:
        description: Explicit compatible model identifier
        required: true
        default: deepseek-v4-flash
permissions:
  contents: read
jobs:
  real-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: omniagent
          POSTGRES_PASSWORD: omniagent-local-only
          POSTGRES_DB: omniagent_real
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U omniagent -d omniagent_real" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      OMNIAGENT_DATABASE_URL: postgresql+psycopg://omniagent:omniagent-local-only@127.0.0.1:5432/omniagent_real
      OMNIAGENT_PROVIDER_API_KEY: ${{ secrets.OMNIAGENT_REAL_PROVIDER_API_KEY }}
      OMNIAGENT_PROVIDER_BASE_URL: ${{ vars.OMNIAGENT_REAL_PROVIDER_BASE_URL }}
      OMNIAGENT_PROVIDER_MODEL: ${{ inputs.model }}
      OMNIAGENT_PROVIDER_THINKING: disabled
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.13"
      - run: python -m pip install uv==0.12.1
      - run: uv sync --locked
      - run: uv run omniagent migrate
      - run: uv run omniagent eval-real --output .pytest-tmp-real
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: real-provider-report
          include-hidden-files: true
          path: .pytest-tmp-real/report.*
