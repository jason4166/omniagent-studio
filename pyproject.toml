[project]
name = "omniagent-studio"
version = "0.1.0"
description = "A configurable enterprise knowledge and workflow Agent platform."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "jsonschema>=4,<5",
    "pypdf==6.16.2",
    "pydantic>=2,<3",
    "sqlalchemy>=2,<3",
    "alembic>=1,<2",
    "psycopg[binary]>=3,<4",
    "pgvector>=0.5,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
    "types-jsonschema>=4,<5",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".uv-cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
