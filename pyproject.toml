[project]
name = "omniagent-studio"
version = "1.0.0rc3"
description = "A configurable enterprise knowledge and workflow Agent platform."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "jsonschema>=4,<5",
    "openai>=2,<3",
    "pypdf==6.16.2",
    "pydantic>=2,<3",
    "sqlalchemy>=2,<3",
    "alembic>=1,<2",
    "psycopg[binary]>=3,<4",
    "pgvector>=0.5,<1",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres>=3,<4",
    "httpx>=0.28,<1",
    "mcp>=1,<2",
    "opentelemetry-sdk>=1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1,<2",
    "argon2-cffi>=25,<26",
    "cryptography>=50,<51",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.15,<2",
    "pip-audit==2.10.1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "types-jsonschema>=4,<5",
]

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omniagent"]

[project.scripts]
omniagent = "omniagent.cli:main"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "unit: isolated deterministic tests",
    "contract: adapter and API contracts",
    "integration: PostgreSQL and local services",
    "e2e: full user workflows",
    "security: adversarial boundary tests",
    "eval: frozen evaluation gates",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    ".uv-cache", ".venv", ".pytest-tmp*", "node_modules",
    "day04_boundary_demo.py", "docs/day10-teaching-guide.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"scripts/acceptance.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
