# Public entry requires explicit operator-provided origin and bind address.
services:
  api:
    environment:
      OMNIAGENT_ENV: production
      OMNIAGENT_AUTH_MODE: password
      OMNIAGENT_PUBLIC_ORIGIN: ${OMNIAGENT_PUBLIC_ORIGIN:?An HTTPS origin is required}
      OMNIAGENT_USER_DAILY_MODEL_CALLS: ${OMNIAGENT_USER_DAILY_MODEL_CALLS:-100}
      OMNIAGENT_GLOBAL_DAILY_MODEL_CALLS: ${OMNIAGENT_GLOBAL_DAILY_MODEL_CALLS:-1000}
      OMNIAGENT_USER_DAILY_TOKENS: ${OMNIAGENT_USER_DAILY_TOKENS:-500000}
      OMNIAGENT_GLOBAL_DAILY_TOKENS: ${OMNIAGENT_GLOBAL_DAILY_TOKENS:-2000000}
    mem_limit: 768m
    pids_limit: 128
  postgres:
    mem_limit: 1g
    pids_limit: 128
  mock:
    mem_limit: 256m
    pids_limit: 64
  web:
    mem_limit: 128m
    pids_limit: 64
  edge:
    build:
      context: .
      dockerfile: docker/edge.Dockerfile
    user: "10001:10001"
    environment:
      OMNIAGENT_DOMAIN: ${OMNIAGENT_DOMAIN:?A domain is required}
    ports:
      - "${OMNIAGENT_BIND_IP:-127.0.0.1}:${OMNIAGENT_HTTP_PORT:-80}:80"
      - "${OMNIAGENT_BIND_IP:-127.0.0.1}:${OMNIAGENT_HTTPS_PORT:-443}:443"
    volumes:
      - tls_data:/data
      - tls_config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      web: {condition: service_healthy}
volumes:
  tls_data:
  tls_config:
