server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1100k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    location = /health {
        access_log off;
        return 200 'ok';
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 55s;
        proxy_send_timeout 10s;
        proxy_connect_timeout 3s;
        access_log off;
    }
    location = /ready {
        proxy_pass http://api:8000/ready;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        access_log off;
    }
    location / {
        try_files $uri $uri/ /index.html;
        access_log off;
    }
}
