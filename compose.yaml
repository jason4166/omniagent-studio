name: omniagent-v1

x-runtime: &runtime
  OMNIAGENT_DATABASE_URL_FILE: /run/secrets/database_url
  OMNIAGENT_ENV: local
  OMNIAGENT_AUTH_MODE: password
  OMNIAGENT_PUBLIC_ORIGIN: ${OMNIAGENT_PUBLIC_ORIGIN:-http://127.0.0.1:8080}
  OMNIAGENT_MOCK_HOST: mock
  OMNIAGENT_MOCK_PORT: "8081"
  OMNIAGENT_TRACE_EXPORTER: none
  OMNIAGENT_JSON_LOGS: "1"

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    user: "999:999"
    environment:
      POSTGRES_DB: omniagent
      POSTGRES_USER: omniagent
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    image: omniagent-api:1.0.0-rc.3
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: api
      args:
        GIT_REVISION: ${OMNIAGENT_GIT_REVISION:-development}
    environment:
      <<: *runtime
      OMNIAGENT_DATABASE_URL_FILE: /run/secrets/owner_url
      OMNIAGENT_RUNTIME_PASSWORD_FILE: /run/secrets/runtime_password
      OMNIAGENT_MOCK_PASSWORD_FILE: /run/secrets/mock_password
    secrets: [owner_url, runtime_password, mock_password]
    command: ["omniagent", "migrate"]
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    healthcheck: {disable: true}
    restart: "no"

  seed:
    image: omniagent-api:1.0.0-rc.3
    environment: *runtime
    secrets: [database_url]
    command: ["omniagent", "seed"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    read_only: true
    tmpfs: [/tmp]
    healthcheck: {disable: true}
    restart: "no"

  mock:
    image: omniagent-mock:1.0.0-rc.3
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: mock
      args:
        GIT_REVISION: ${OMNIAGENT_GIT_REVISION:-development}
    environment:
      <<: *runtime
      OMNIAGENT_DATABASE_URL_FILE: /run/secrets/mock_url
    secrets: [mock_url]
    depends_on:
      migrate: {condition: service_completed_successfully}
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  api:
    image: omniagent-api:1.0.0-rc.3
    environment: *runtime
    secrets: [database_url]
    depends_on:
      seed: {condition: service_completed_successfully}
      mock: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  web:
    image: omniagent-web:1.0.0-rc.3
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:${OMNIAGENT_WEB_PORT:-8080}:8080"
    depends_on:
      api: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  test:
    profiles: [test]
    user: "${OMNIAGENT_TEST_UID:-10001}:${OMNIAGENT_TEST_GID:-10001}"
    image: omniagent-test:1.0.0-rc.3
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: test
      args:
        GIT_REVISION: ${OMNIAGENT_GIT_REVISION:-development}
    environment:
      <<: *runtime
      OMNIAGENT_DATABASE_URL_FILE: /run/secrets/owner_url
      OMNIAGENT_ENV: test
      OMNIAGENT_AUTH_MODE: dev
      OMNIAGENT_MOCK_HOST: "127.0.0.1"
      COVERAGE_FILE: /reports/.coverage
    secrets: [owner_url]
    volumes:
      - ./.pytest-tmp-container-reports:/reports
    depends_on:
      seed: {condition: service_completed_successfully}
    tmpfs: [/tmp]
    restart: "no"

  web-test:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: test
    restart: "no"

volumes:
  pgdata:

secrets:
  database_password:
    file: ${OMNIAGENT_SECRET_DIR:?Use scripts/ops.py to initialize private deployment credentials}/database_password
  database_url:
    file: ${OMNIAGENT_SECRET_DIR:?Use scripts/ops.py to initialize private deployment credentials}/database_url
  owner_url:
    file: ${OMNIAGENT_SECRET_DIR:?Use scripts/ops.py to initialize private deployment credentials}/owner_url
  runtime_password:
    file: ${OMNIAGENT_SECRET_DIR:?Use scripts/ops.py to initialize private deployment credentials}/runtime_password
  mock_password:
    file: ${OMNIAGENT_SECRET_DIR:?Use scripts/ops.py to initialize private deployment credentials}/mock_password
  mock_url:
    file: ${OMNIAGENT_SECRET_DIR:?Use scripts/ops.py to initialize private deployment credentials}/mock_url
