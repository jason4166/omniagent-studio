services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omniagent}
      POSTGRES_USER: ${POSTGRES_USER:-omniagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omniagent-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - omniagent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  omniagent_postgres_data:
